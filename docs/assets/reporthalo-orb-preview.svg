<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ReportHalo Floating Orb preview</title>
  <desc id="desc">A compact translucent orb with a 3 by 3 action matrix beside a report editor.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081924"/>
      <stop offset=".55" stop-color="#0b3140"/>
      <stop offset="1" stop-color="#173a4c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fbffff"/>
      <stop offset="1" stop-color="#e8f3f3"/>
    </linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%" r="75%">
      <stop stop-color="#d9fff6"/>
      <stop offset=".4" stop-color="#69d9ce"/>
      <stop offset="1" stop-color="#16868c"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#baffef"/>
      <stop offset=".55" stop-color="#6bc7da"/>
      <stop offset="1" stop-color="#736fe1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#001018" flood-opacity=".38"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
