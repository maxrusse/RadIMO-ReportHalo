<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">ReportHalo mark</title>
  <desc id="desc">A luminous mint halo around a compact medical signal core.</desc>
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e6fff8"/>
      <stop offset=".42" stop-color="#73dfcb"/>
      <stop offset="1" stop-color="#158b8f"/>
    </radialGradient>
    <linearGradient id="ring" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0" stop-color="#b8fff1"/>
      <stop offset=".5" stop-color="#66d6d1"/>
      <stop offset="1" stop-color="#596de1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="31" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".85" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="20" fill="url(#core)"/>
  <path d="M39 58V38h10.5a8 8 0 0 1 0 16H39m0-8h10.5M51 54l7 8" fill="none" stroke="#082632" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#85eee2" stroke-opacity=".14" stroke-width="1" stroke-dasharray="2 6"/>
</svg>
