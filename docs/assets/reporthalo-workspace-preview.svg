  <rect x="114" y="564" width="216" height="38" rx="12" fill="#dff5ef"/><text x="222" y="588" text-anchor="middle" fill="#176d68" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">VORSCHLAG BEARBEITEN</text>

