<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ReportHalo Text and Chat workspace preview</title>
  <desc id="desc">An attached workspace with report text on the left and a compact discussion panel on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1d29"/><stop offset="1" stop-color="#173b4a"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fdfd"/><stop offset="1" stop-color="#e8f2f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#00131d" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <rect x="56" y="51" width="1088" height="618" rx="28" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="56" y="51" width="1088" height="74" rx="28" fill="#d9e9e9"/>
  <circle cx="91" cy="88" r="8" fill="#ee8b87"/><circle cx="116" cy="88" r="8" fill="#eccb70"/><circle cx="141" cy="88" r="8" fill="#70c9a1"/>
