<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RadimoAgent screen capture</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; cursor: crosshair; }
      #selection { position: fixed; display: none; border: 2px solid #77e2d0; background: rgba(119, 226, 208, .16); box-shadow: 0 0 0 9999px rgba(2, 9, 17, .52), 0 0 26px rgba(119, 226, 208, .28); pointer-events: none; }
      #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 9px 13px; border: 1px solid rgba(119, 226, 208, .45); border-radius: 9px; background: rgba(6, 28, 39, .94); color: #dff5f1; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.4); cursor: default; }
      #cancel { margin-left: 10px; border: 1px solid rgba(119, 226, 208, .4); border-radius: 6px; padding: 4px 9px; background: #0b3441; color: #c9e8e4; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="selection"></div>
    <div id="hint">Drag to capture a screen region · Esc to cancel <button id="cancel" type="button">Cancel</button></div>
    <script src="./snip.js"></script>
  </body>
</html>
